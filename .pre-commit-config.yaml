repos:
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.48.0
  hooks:
  - id: markdownlint
    # `.github/` is excluded to match `just lint`, which CI runs and which
    # globs README, AGENTS and skills/ only. The hook was the stricter of two
    # copies of one rule, so a PR template — which must not open with an H1,
    # since the PR title is the heading — failed here and nowhere else.
    exclude: ^(\.(agent|agents|claude)|\.github)/
- repo: local
  hooks:
  - id: validate-skills
    name: validate-skills
    entry: python3 scripts/validate_skills.py
    language: system
    pass_filenames: false
    files: ^(skills/|README\.md|scripts/validate_skills\.py)