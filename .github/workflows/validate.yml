name: validate

# Structural validation only — deterministic, no LLM, no secrets.
# Behavioral skill evals are local-only by design (evals/README.md):
# they use the developer's authenticated Claude Code CLI, so no API
# keys ever live in this repository or its CI.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The default pull_request checkout is the merge commit with a
          # shallow history, so origin/base..HEAD holds none of the PR's
          # own commits and the message check would pass vacuously.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            README.md
            skills/**/*.md
          config: .markdownlint.yml

      - name: Structural skill validation
        run: python3 scripts/validate_skills.py

      - name: Skill script tests
        working-directory: tests
        run: python3 -m unittest discover -s . -p 'test_*.py' -v

      - name: Commit message format
        if: github.event_name == 'pull_request'
        run: |
          python3 skills/gitmoji-conventional/scripts/check_commit_msg.py \
            --range "origin/${{ github.base_ref }}..HEAD"
